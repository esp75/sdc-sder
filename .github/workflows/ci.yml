name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check src tests scripts
      - run: uv run python scripts/check_doc_links.py
      - run: uv run mypy
      - run: uv run pytest
      - name: CLI smoke test
        run: |
          uv run sder score examples/*.yaml
          uv run sdc demo "$RUNNER_TEMP/demo.jsonl"
          uv run sdc verify "$RUNNER_TEMP/demo.jsonl"

  licensing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5
