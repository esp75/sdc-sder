[project]
name = "sdc-sder"
version = "0.2.0"
description = "Reference implementation of the SDC/SDER principles: evidence-aware debris exposure scoring and a tamper-evident claim registry."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Maxime Kadri" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
]
keywords = ["space debris", "orbital sustainability", "risk rating", "space policy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
]

[project.urls]
Homepage = "https://github.com/esp75/sdc-sder"
Repository = "https://github.com/esp75/sdc-sder"

[project.scripts]
sder = "sder.cli:main"
sdc = "sdc.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "jsonschema>=4.23",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]
research = [
    "markdown-it-py>=4.2.0",
    "matplotlib>=3.11.2",
    "playwright>=1.63.0",
    "pymsis>=0.13.0",
    "pypdf>=6.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sder", "src/sdc"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# HTML, CSS and SVG templates for the Rulebook PDF and web export
"scripts/{build_rulebook_pdf,rulebook_figures,rulebook_doc,export_rulebook}.py" = ["E501", "RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["sder", "sdc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=sder --cov=sdc --cov-report=term-missing --cov-fail-under=90"
